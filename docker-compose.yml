version: '3.8'

services:
  # GPU-enabled version (recommended for production)
  marker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: marker-pdf-gpu
    ports:
      - "8001:8001"
    volumes:
      # Persist model cache to avoid redownloading
      - ./datalab:/root/.cache/datalab
      # Optional: Mount upload and output directories
      - ./uploads:/app/uploads
      - ./output:/app/output
    environment:
      # Server Configuration
      - PORT=8001
      - HOST=0.0.0.0
      - TORCH_DEVICE=cuda

      # VRAM Management (uncomment for low-VRAM devices)
      # When enabled, models are unloaded after processing to free VRAM (~3-5GB saved)
      # Trade-off: First request after idle period takes ~2-5s longer (model loading)
      # Use this if you have < 4GB VRAM available
      # - FREE_VRAM_ON_IDLE=true

      # Llama-Swap Model Unload (uncomment if using llama-swap with USE_LLM=true)
      # Unloads the llama-swap LLM model before OCR to free additional VRAM (~1-2GB)
      # Required: llama-swap service running separately
      # Example: http://172.17.0.1:9292
      # - UNLOAD_LLAMA_SWAP_BASE_URL=http://172.17.0.1:9292

      # ===== LLM Configuration =====
      # How to use LLM with marker_server:
      # 1. Configure ONE LLM provider below (the first available will be auto-selected)
      # 2. OpenWebUI will toggle {"use_llm": true/false} per request to enable LLM on-demand
      #
      # NOTE: When "use_llm" is not sent by OpenWebUI or is false, marker_server will process
      # PDFs normally without LLM, maintaining full backward compatibility.

      # Uncomment ONE provider configuration below:

      # --- Gemini (Google) - Recommended as default ---
      # - GEMINI_API_KEY=your-gemini-api-key
      # - GEMINI_MODEL_NAME=gemini-2.0-flash
      # - THINKING_BUDGET=10000

      # --- OpenAI ---
      # - OPENAI_API_KEY=your-openai-api-key
      # - OPENAI_MODEL=gpt-4o-mini
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_IMAGE_FORMAT=url

      # --- Claude (Anthropic) ---
      # - CLAUDE_API_KEY=your-claude-api-key
      # - CLAUDE_MODEL_NAME=claude-3-5-sonnet-20241022
      # - MAX_CLAUDE_TOKENS=8192

      # --- Azure OpenAI ---
      # - AZURE_ENDPOINT=https://your-resource.openai.azure.com/
      # - AZURE_API_KEY=your-azure-api-key
      # - AZURE_API_VERSION=2024-02-15-preview
      # - DEPLOYMENT_NAME=your-deployment-name

      # --- Ollama (Local Models - No API key required) ---
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=llama2-vision

      # Optional: Explicitly specify LLM service (usually auto-detected from API keys)
      # - LLM_SERVICE=marker.services.openai.OpenAIService

      # Optional: LLM Request Configuration
      # - TIMEOUT=30
      # - MAX_RETRIES=2
      # - RETRY_WAIT_TIME=1
      # - MAX_OUTPUT_TOKENS=8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # CPU-only version (smaller, no GPU required)
  marker-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: marker-pdf-cpu
    ports:
      - "8001:8001"
    volumes:
      # Persist model cache to avoid redownloading
      - ./datalab:/root/.cache/datalab
      # Optional: Mount upload and output directories
      - ./uploads:/app/uploads
      - ./output:/app/output
    environment:
      # Server Configuration
      - PORT=8001
      - HOST=0.0.0.0
      - TORCH_DEVICE=cpu

      # Llama-Swap Model Unload (uncomment if using llama-swap with USE_LLM=true)
      # Unloads the llama-swap LLM model before OCR to free additional VRAM (~1-2GB)
      # Required: llama-swap service running separately
      # Example: http://172.17.0.1:9292
      # - UNLOAD_LLAMA_SWAP_BASE_URL=http://172.17.0.1:9292

      # ===== LLM Configuration =====
      # How to use LLM with marker_server:
      # 1. Configure ONE LLM provider below (the first available will be auto-selected)
      # 2. OpenWebUI will toggle {"use_llm": true/false} per request to enable LLM on-demand
      #
      # NOTE: When "use_llm" is not sent by OpenWebUI or is false, marker_server will process
      # PDFs normally without LLM, maintaining full backward compatibility.

      # Uncomment ONE provider configuration below:

      # --- Gemini (Google) - Recommended as default ---
      # - GEMINI_API_KEY=your-gemini-api-key
      # - GEMINI_MODEL_NAME=gemini-2.0-flash

      # --- OpenAI ---
      # - OPENAI_API_KEY=your-openai-api-key
      # - OPENAI_MODEL=gpt-4o-mini

      # --- Claude (Anthropic) ---
      # - CLAUDE_API_KEY=your-claude-api-key
      # - CLAUDE_MODEL_NAME=claude-3-5-sonnet-20241022

      # --- Ollama (Local Models - No API key required) ---
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=llama2-vision
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - cpu
